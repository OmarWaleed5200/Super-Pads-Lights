<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Pads Lights Clone</title>
<style>
    body {
        background-color: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        font-size: 28px;
        margin-bottom: 20px;
    }

    .controls {
        margin-bottom: 20px;
    }

    button {
        background: #222;
        color: white;
        border: none;
        padding: 8px 14px;
        margin: 5px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        background: #444;
    }

    .pad-grid {
        display: grid;
        grid-template-columns: repeat(4, 120px);
        grid-gap: 20px;
        justify-content: center;
    }

    .pad {
        position: relative;
        width: 120px;
        height: 120px;
        background: #111;
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: 0.2s;
    }

    .pad.active {
        transform: scale(1.05);
        box-shadow: 0 0 35px var(--glow-color);
    }

    .key-label {
        font-size: 24px;
        margin-bottom: 10px;
    }

    .volume-slider {
        width: 80%;
        margin-bottom: 5px;
    }

    .volume-value {
        font-size: 12px;
    }
</style>
</head>
<body>
    <h1>Super Pads Lights Clone</h1>

    <div class="controls">
        <button id="record">Record</button>
        <button id="stop">Stop</button>
        <button id="play">Play</button>
        <button id="clear">Clear</button>
        <button id="loop">Loop</button>
    </div>

    <div class="pad-grid" id="padGrid"></div>

<script>
const padKeys = ['Q','W','E','R','A','S','D','F','Z','X','C','V','1','2','3','4'];
const glowColors = ['#ff0000','#ffa500','#00ff00','#00bfff','#00ffff','#007bff','#ff00ff','#ff1493','#00ffcc','#ff6600','#00ff99','#cc00ff','#ff0000','#00bfff','#00ff00','#ff00ff'];
const padGrid = document.getElementById("padGrid");

// Recording system
let isRecording = false;
let recordedNotes = [];
let startTime = 0;
let isLooping = false;
let loopInterval;

padKeys.forEach((key, i) => {
    const pad = document.createElement("div");
    pad.classList.add("pad");
    pad.style.setProperty("--glow-color", glowColors[i]);
    pad.dataset.key = key;

    pad.innerHTML = `
        <div class="key-label">${key}</div>
        <input type="range" min="0" max="1" value="1" step="0.01" class="volume-slider">
        <div class="volume-value">1</div>
    `;

    pad.querySelector(".volume-slider").addEventListener("input", e => {
        pad.querySelector(".volume-value").textContent = e.target.value;
    });

    pad.addEventListener("click", () => triggerPad(key));
    padGrid.appendChild(pad);
});

function triggerPad(key) {
    const pad = document.querySelector(`.pad[data-key="${key}"]`);
    if (!pad) return;

    pad.classList.add("active");
    setTimeout(() => pad.classList.remove("active"), 200);

    // Record the note
    if (isRecording) {
        recordedNotes.push({
            key,
            time: Date.now() - startTime
        });
    }

    // You can later attach sound logic here
    console.log(`Pad ${key} triggered`);
}

// Keyboard support
document.addEventListener("keydown", e => {
    const key = e.key.toUpperCase();
    if (padKeys.includes(key)) triggerPad(key);
});

// Record / Play / Stop / Clear / Loop buttons
document.getElementById("record").addEventListener("click", () => {
    recordedNotes = [];
    startTime = Date.now();
    isRecording = true;
    console.log("Recording started...");
});

document.getElementById("stop").addEventListener("click", () => {
    isRecording = false;
    clearInterval(loopInterval);
    isLooping = false;
    console.log("Stopped recording or looping.");
});

document.getElementById("play").addEventListener("click", () => {
    if (recordedNotes.length === 0) return;
    console.log("Playing sequence...");
    playSequence();
});

document.getElementById("clear").addEventListener("click", () => {
    recordedNotes = [];
    isRecording = false;
    isLooping = false;
    clearInterval(loopInterval);
    console.log("Cleared recorded notes.");
});

document.getElementById("loop").addEventListener("click", () => {
    if (recordedNotes.length === 0) return;
    isLooping = !isLooping;
    if (isLooping) {
        console.log("Looping enabled.");
        playSequence(true);
    } else {
        clearInterval(loopInterval);
        console.log("Looping stopped.");
    }
});

function playSequence(loop = false) {
    recordedNotes.forEach(note => {
        setTimeout(() => triggerPad(note.key), note.time);
    });

    if (loop) {
        const lastNoteTime = recordedNotes[recordedNotes.length - 1].time;
        loopInterval = setTimeout(() => playSequence(true), lastNoteTime + 500);
    }
}
</script>
</body>
</html>
